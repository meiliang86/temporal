log:
  stdout: true
  level: warn

persistence:
  defaultStore: default
  visibilityStore: visibility
  numHistoryShards: 4
  datastores:
    default:
      sql:
        pluginName: "postgres12"
        databaseName: "temporal_b"
        connectAddr: "127.0.0.1:5432"
        connectProtocol: "tcp"
        user: "postgres"
        password: ""
        maxConns: 100
        maxIdleConns: 100
        maxConnLifetime: "1h"
    visibility:
      sql:
        pluginName: "postgres12"
        databaseName: "temporal_b_vis"
        connectAddr: "127.0.0.1:5432"
        connectProtocol: "tcp"
        user: "postgres"
        password: ""
        maxConns: 20
        maxIdleConns: 20
        maxConnLifetime: "1h"

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: "127.0.0.1"
  pprof:
    port: 8936
  metrics:
    prometheus:
      framework: "tally"
      timerType: "histogram"
      listenAddress: "127.0.0.1:8001"

services:
  frontend:
    rpc:
      grpcPort: 8233
      membershipPort: 8933
      bindOnLocalHost: true
      httpPort: 8243
  matching:
    rpc:
      grpcPort: 8235
      membershipPort: 8935
      bindOnLocalHost: true
  history:
    rpc:
      grpcPort: 8234
      membershipPort: 8934
      bindOnLocalHost: true
  worker:
    rpc:
      grpcPort: 8239
      membershipPort: 8939
      bindOnLocalHost: true

clusterMetadata:
  enableGlobalNamespace: true
  failoverVersionIncrement: 100
  masterClusterName: "cluster-b"
  currentClusterName: "cluster-b"
  clusterInformation:
    cluster-b:
      enabled: true
      initialFailoverVersion: 2
      rpcName: "frontend"
      rpcAddress: "localhost:8233"

dcRedirectionPolicy:
  policy: "noop"

dynamicConfigClient:
  filepath: "/home/user/perf/config/dynamic-b.yaml"
  pollInterval: "5s"
